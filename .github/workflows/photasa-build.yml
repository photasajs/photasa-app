name: Photasa PR Build Matrix

on:
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

# Windows native dependencies are now provisioned by setup-photasa-windows-msvc.
env:
    PHOTASA_CI_WINDOWS_ENABLED: "true"

jobs:
    check:
        name: Lint & Test (Ubuntu)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Toolchain
              uses: ./.github/actions/setup-photasa-toolchain
              with:
                  checkout: "false"

            - name: Verify workspace version alignment
              run: pnpm run check-version

            - name: Run ESLint
              run: pnpm --filter @photasa/photasa run lint

            - name: Run TypeScript Typecheck
              run: pnpm --filter @photasa/photasa run typecheck

            - name: Run Frontend Unit Tests
              run: pnpm --filter @photasa/photasa run test:unit

            - name: Guard prod CI from dev build channel (RFC 0157)
              run: bash scripts/ci/guard-prod-build-channel.sh

            - name: Run Rust Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Run Rust Unit Tests
              run: cargo test --workspace

    platforms:
        name: Resolve build platforms
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.resolve.outputs.matrix }}
        steps:
            - name: Resolve matrix OS list
              id: resolve
              shell: bash
              run: |
                  set -euo pipefail
                  platforms='["ubuntu-latest","macos-latest"]'
                  if [ "${{ env.PHOTASA_CI_WINDOWS_ENABLED }}" = "true" ]; then
                    platforms='["ubuntu-latest","macos-latest","windows-latest"]'
                  fi
                  echo "matrix=$platforms" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.os }})
        needs: [check, platforms]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(needs.platforms.outputs.matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Toolchain
              uses: ./.github/actions/setup-photasa-toolchain
              with:
                  checkout: "false"

            # Workflow-level if skips action download on Linux/macOS (composite inner if does not).
            - name: Setup Windows MSVC (FFmpeg)
              if: runner.os == 'Windows'
              uses: ./.github/actions/setup-photasa-windows-msvc

            - name: Build Tauri App (Linux Debug Profile)
              if: runner.os == 'Linux'
              shell: bash
              # Linux: deb only — matrix CI smoke, not release triple-bundle (RFC 0158).
              run: pnpm --filter @photasa/photasa run build:ci:linux

            - name: Build Tauri App (macOS Debug Profile)
              if: runner.os == 'macOS'
              shell: bash
              run: pnpm --filter @photasa/photasa run build:ci

            # Git Bash prepends its Unix link.exe, which shadows the MSVC linker.
            - name: Build Tauri App (Windows Debug Profile)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $linker = (Get-Command link.exe -CommandType Application).Source
                  if ($linker -match '[/\\]Git[/\\]usr[/\\]bin') {
                      Write-Error "Git Unix linker shadows MSVC link.exe: $linker"
                      exit 1
                  }
                  Write-Output "Using MSVC linker: $linker"
                  pnpm --filter @photasa/photasa run build:ci:windows

            - name: Upload Windows installer artifact
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: Photasa-windows-installer-${{ github.sha }}
                  path: apps/photasa/src-tauri/target/debug/bundle/nsis/*.exe
                  if-no-files-found: error
                  retention-days: 14
